# Optional ROS parameter overrides for giraffe_driver.
# Primary arm config (port, servo IDs, reverse, offset) lives in:
#   <repo>/config/follower.yaml
# Generate it with: python3 scripts/giraffe_setup.py
#
# To override from ROS, replace the empty map below, for example:
#   follower_config: "/absolute/path/to/config/follower.yaml"
#   joint_reverse.shoulder_pan_actuator_shoulder_pan_joint: true
#   joint_offset.shoulder_pan_actuator_shoulder_pan_joint: 0.0

giraffe_driver:
  ros__parameters: {}
